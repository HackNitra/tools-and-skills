services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: __DB__
    ports:
      - "__DB_PORT__:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./packages/db/docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d __DB__"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
